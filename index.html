<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CNC / MCT 계산기</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1f2d4a;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --yellow: #facc15;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    
    header {
      background: #0f172a; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; gap: 8px;
    }
    header h1 {
      font-size: 19px; font-weight: 800; color: #ffffff; letter-spacing: -0.6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    header h1 span { color: var(--accent); }

    .header-biz-card {
      background: #ffffff; color: #1e293b; border-radius: 6px;
      padding: 4px 8px 4px 10px; position: relative; overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0;
    }
    .header-biz-card::before { content: ""; position: absolute; left: 0; top: 0; width: 4px; height: 75%; background: #1e293b; }
    .header-biz-card::after { content: ""; position: absolute; left: 0; bottom: 0; width: 4px; height: 25%; background: #dc2626; }
    .hbc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .hbc-name { font-size: 11px; font-weight: 800; color: #0f172a; line-height: 1; }
    .hbc-role { font-size: 8px; font-weight: 600; color: #475569; }

    .hbc-bottom {
      border-top: 1px solid #f1f5f9; padding-top: 2px; font-size: 8px; color: #475569;
      display: flex; flex-direction: column; gap: 1px; font-weight: 600;
    }
    .hbc-row { display: flex; justify-content: space-between; gap: 4px; }
    .hbc-row a { color: inherit; text-decoration: none; }

    header button.btn-back {
      background: #1e293b; border: 1px solid var(--border); color: #fff;
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }

    .container { flex: 1; padding: 12px; display: flex; flex-direction: column; }

    .main-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      padding-bottom: 12px;
    }
    .menu-btn {
      background: linear-gradient(145deg, #131b2e, #0e1626); border: 2px solid var(--border); border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700; text-align: center; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35); transition: all 0.15s; line-height: 1.4; padding: 16px 12px; min-height: 86px;
    }
    .menu-btn:active { border-color: var(--accent); transform: scale(0.97); }
    .menu-btn span { font-size: 11px; color: var(--text-muted); margin-top: 5px; font-weight: normal; }

    .home-footer-note {
      text-align: center;
      padding: 14px 10px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
      background: rgba(19, 27, 46, 0.4);
      border: 1px dashed var(--border);
      border-radius: 8px;
      margin-top: auto;
      margin-bottom: 6px;
    }
    .home-footer-note strong { color: var(--accent); font-weight: 600; }

    .sub-view { display: none; flex-direction: column; gap: 8px; height: 100%; }
    .card { background: var(--card-bg); border-radius: 10px; padding: 10px; border: 1px solid var(--border); }
    label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    
    input, textarea, select {
      width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 6px;
      color: #fff; padding: 8px; font-size: 13px; margin-bottom: 5px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    .input-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .info-box {
      background: #090d16; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; font-family: monospace; font-size: 11px; color: var(--accent);
      max-height: 130px; overflow-y: auto; white-space: pre-wrap; line-height: 1.45;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">CNC / MCT <span>계산기</span></h1>

    <div class="header-biz-card" id="headerBizCard">
      <div class="hbc-top">
        <div class="hbc-name">Ryu Yun-hu</div>
        <div class="hbc-role">Application Engineer</div>
      </div>
      <div class="hbc-bottom">
        <div class="hbc-row">
          <span>📱 <a href="tel:010-6599-2582">010-6599-2582</a></span>
        </div>
        <div class="hbc-row">
          <span>✉ <a href="mailto:ryh88@taegutec.co.kr"><strong>ryh88@taegutec.co.kr</strong></a></span>
        </div>
      </div>
    </div>

    <button class="btn-back" id="btnHome" onclick="goHome()" style="display: none;">‹ 홈으로</button>
  </header>

  <div class="container">
    <div id="view-main">
      <div class="main-grid">
        <div class="menu-btn" onclick="openView('lathe-calc')">
          선반 절삭조건 계산
          <span>Vc ↔ RPM & 조도(Rz)</span>
        </div>
        <div class="menu-btn" onclick="openView('mct-calc')">
          밀링 절삭조건 계산
          <span>N ↔ Vc & F ↔ Fz & 공출량(Q)</span>
        </div>

        <div class="menu-btn" onclick="window.open('https://www.duracarb.co.kr/page/techInfomations.aspx?ID=turn', '_blank')">
          Duracarb 터닝
        </div>
        <div class="menu-btn" onclick="window.open('https://www.duracarb.co.kr/page/techInfomations.aspx?ID=mill', '_blank')">
          Duracarb 밀링
        </div>

        <div class="menu-btn" onclick="window.open('https://www.duracarb.co.kr/page/techInfomations.aspx?ID=cut', '_blank')">
          Duracarb 홈 가공
        </div>
        <div class="menu-btn" onclick="window.open('https://www.duracarb.co.kr/page/techInfomations.aspx?ID=drill', '_blank')">
          Duracarb 드릴링
        </div>
      </div>

      <div class="home-footer-note">
        사용 시 불편한 점 있으시면 언제든 연락주세요.
      </div>
    </div>

    <!-- 1. CNC 선반 계산기 -->
    <div id="view-lathe-calc" class="sub-view">
      <div class="card">
        <label>가공 직경 Φ (mm)</label>
        <input type="number" id="l_dia" placeholder="예: 86.95" oninput="calcLathe(1)" />
        <label>절삭속도 Vc (m/min)</label>
        <input type="number" id="l_vc" placeholder="예: 250" oninput="calcLathe(1)" />
        <label>주축 회전수 N (RPM)</label>
        <input type="number" id="l_rpm" placeholder="예: 915" oninput="calcLathe(2)" />
        <label>회전당 이송 f (mm/rev)</label>
        <input type="number" id="l_feed" placeholder="예: 0.35" step="0.01" oninput="calcLathe(1)" />
        <label>인서트 노즈 R (mm)</label>
        <input type="number" id="l_nr" placeholder="예: 0.8" step="0.4" oninput="calcLathe(1)" />
      </div>
      <div class="info-box" id="latheCalcReport">파라미터를 입력하면 실시간 상호 산출됩니다.</div>
    </div>

    <!-- 2. 밀링 계산기 -->
    <div id="view-mct-calc" class="sub-view">
      <div class="card">
        <div class="input-grid-2">
          <div>
            <label>직경 Φ (mm)</label>
            <input type="number" id="m_dia" placeholder="예: 10" oninput="onMctDiaChange()" />
          </div>
          <div>
            <label>날 수 (Z)</label>
            <input type="number" id="m_teeth" placeholder="예: 4" oninput="onMctTeethChange()" />
          </div>
        </div>

        <div class="input-grid-2">
          <div>
            <label>주축 회전수 N (RPM)</label>
            <input type="number" id="m_rpm" placeholder="예: 3820" oninput="calcMctParam(2)" />
          </div>
          <div>
            <label>절삭속도 Vc (m/min)</label>
            <input type="number" id="m_vc" placeholder="예: 120" oninput="calcMctParam(1)" />
          </div>
        </div>
        
        <div class="input-grid-2">
          <div>
            <label>이송 FEED (F mm/min)</label>
            <input type="number" id="m_feed" placeholder="예: 764" oninput="calcMctFeed(2)" />
          </div>
          <div>
            <label>날당 이송 Fz (mm/t)</label>
            <input type="number" id="m_fz" placeholder="예: 0.05" step="0.005" oninput="calcMctFeed(1)" />
          </div>
        </div>

        <div class="input-grid-2">
          <div>
            <label>절삭 폭 ae (mm)</label>
            <input type="number" id="m_ae" placeholder="예: 5" oninput="updateMctChipRate()" />
          </div>
          <div>
            <label>절삭 깊이 ap (mm)</label>
            <input type="number" id="m_ap" placeholder="예: 2" oninput="updateMctChipRate()" />
          </div>
        </div>
      </div>
      <div class="info-box" id="mctCalcReport">파라미터 입력 시 절삭조건 및 공출량(Q)이 실시간 양방향 연동됩니다.</div>
    </div>
  </div>

  <script>
    function goHome() {
      document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none');
      document.getElementById('view-main').style.display = 'block';
      document.getElementById('headerBizCard').style.display = 'flex';
      document.getElementById('btnHome').style.display = 'none';
      document.getElementById('headerTitle').innerHTML = 'CNC / MCT <span>계산기</span>';
    }

    function openView(name) {
      document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none');
      document.getElementById('view-main').style.display = 'none';
      document.getElementById('headerBizCard').style.display = 'none';
      document.getElementById('btnHome').style.display = 'block';
      const titles = {
        'lathe-calc': '선반 절삭조건 계산',
        'mct-calc': '밀링 절삭조건 계산'
      };
      document.getElementById('headerTitle').innerText = titles[name];
      document.getElementById('view-' + name).style.display = 'flex';
    }

    /* CNC 선반 절삭 계산기 */
    function calcLathe(mode) {
      const d = parseFloat(document.getElementById('l_dia').value);
      const vcIn = document.getElementById('l_vc');
      const rpmIn = document.getElementById('l_rpm');
      const fIn = document.getElementById('l_feed');
      const nrIn = document.getElementById('l_nr');
      
      const f = parseFloat(fIn.value) || 0.35;
      const nr = parseFloat(nrIn.value) || 0.8;
      if (!d || d <= 0) return;

      let vc = 0, rpm = 0;
      if (mode === 1 && vcIn.value) {
        vc = parseFloat(vcIn.value);
        rpm = Math.round((1000 * vc) / (Math.PI * d));
        rpmIn.value = rpm;
      } else if (mode === 2 && rpmIn.value) {
        rpm = parseFloat(rpmIn.value);
        vc = ((Math.PI * d * rpm) / 1000).toFixed(1);
        vcIn.value = vc;
      } else return;

      const rz = ((f * f) / (8 * nr)) * 1000;
      document.getElementById('latheCalcReport').innerText =
        `[계산 결과]\n• 주축 속도 (N) : ${rpm} RPM\n• 절삭 속도 (Vc) : ${vc} m/min\n• 분당 피드 : ${(rpm * f).toFixed(1)} mm/min\n• 이론 조도 Rz : ${rz.toFixed(1)} ㎛ (Ra 약 ${(rz/4).toFixed(2)} ㎛)`;
    }

    /* 밀링 절삭 계산기 */
    function onMctDiaChange() {
      const d = parseFloat(document.getElementById('m_dia').value);
      const vcIn = document.getElementById('m_vc');
      const rpmIn = document.getElementById('m_rpm');

      if (!d || d <= 0) return;
      if (vcIn.value) {
        calcMctParam(1);
      } else if (rpmIn.value) {
        calcMctParam(2);
      }
    }

    function onMctTeethChange() {
      const z = parseFloat(document.getElementById('m_teeth').value);
      const feedIn = document.getElementById('m_feed');
      const fzIn = document.getElementById('m_fz');

      if (!z || z <= 0) return;
      if (feedIn.value) {
        calcMctFeed(2);
      } else if (fzIn.value) {
        calcMctFeed(1);
      }
    }

    function calcMctParam(mode) {
      const d = parseFloat(document.getElementById('m_dia').value);
      const vcIn = document.getElementById('m_vc');
      const rpmIn = document.getElementById('m_rpm');
      const z = parseFloat(document.getElementById('m_teeth').value);
      const fzIn = document.getElementById('m_fz');
      const feedIn = document.getElementById('m_feed');

      let currentRpm = 0;

      if (mode === 1) {
        const vc = parseFloat(vcIn.value);
        if (d && d > 0 && !isNaN(vc)) {
          currentRpm = Math.round((1000 * vc) / (Math.PI * d));
          rpmIn.value = currentRpm;
        }
      } else if (mode === 2) {
        const rpm = parseFloat(rpmIn.value);
        if (d && d > 0 && !isNaN(rpm)) {
          currentRpm = rpm;
          vcIn.value = ((Math.PI * d * rpm) / 1000).toFixed(1);
        }
      }

      if (currentRpm > 0 && z && z > 0) {
        if (feedIn.value !== "") {
          const f = parseFloat(feedIn.value);
          if (!isNaN(f)) {
            fzIn.value = parseFloat((f / (z * currentRpm)).toFixed(4));
          }
        } else if (fzIn.value !== "") {
          const fz = parseFloat(fzIn.value);
          if (!isNaN(fz)) {
            feedIn.value = Math.round(fz * z * currentRpm);
          }
        }
      }

      updateMctChipRate();
    }

    function calcMctFeed(mode) {
      const z = parseFloat(document.getElementById('m_teeth').value);
      const rpm = parseFloat(document.getElementById('m_rpm').value);
      const fzIn = document.getElementById('m_fz');
      const feedIn = document.getElementById('m_feed');

      if (!z || !rpm || z <= 0 || rpm <= 0) {
        updateMctChipRate();
        return;
      }

      if (mode === 1) {
        const fz = parseFloat(fzIn.value);
        if (!isNaN(fz)) {
          feedIn.value = Math.round(fz * z * rpm);
        }
      } else if (mode === 2) {
        const f = parseFloat(feedIn.value);
        if (!isNaN(f)) {
          fzIn.value = parseFloat((f / (z * rpm)).toFixed(4));
        }
      }
      updateMctChipRate();
    }

    function updateMctChipRate() {
      const d = parseFloat(document.getElementById('m_dia').value) || 0;
      const z = parseFloat(document.getElementById('m_teeth').value) || 0;
      const rpm = parseFloat(document.getElementById('m_rpm').value) || 0;
      const vcIn = document.getElementById('m_vc').value;
      const feedIn = document.getElementById('m_feed').value;
      const fzIn = document.getElementById('m_fz').value;
      const ae = parseFloat(document.getElementById('m_ae').value) || 0;
      const ap = parseFloat(document.getElementById('m_ap').value) || 0;

      const f = parseFloat(feedIn) || 0;
      const fz = parseFloat(fzIn) || 0;
      const vc = vcIn ? parseFloat(vcIn) : (d > 0 && rpm > 0 ? ((Math.PI * d * rpm) / 1000).toFixed(1) : '-');
      const qVal = ((ae * ap * f) / 1000).toFixed(2);

      document.getElementById('mctCalcReport').innerText =
        `=== 밀링 절삭조건 산출 ===\n` +
        `• 주축 회전수 (N) : ${rpm ? rpm + ' RPM' : '-'} | Vc: ${vc} m/min\n` +
        `• 날당 이송 (Fz) : ${fz ? fz + ' mm/tooth' : '-'} | 회전당: ${(fz * z).toFixed(3)} mm/rev\n` +
        `• 테이블 이송 (F) : ${f ? f + ' mm/min' : '-'}\n` +
        `------------------------------------\n` +
        `[공출량 (칩 배출량 Q)]\n• Q = ${qVal} cm³/min (cc/min)\n  (조건: ae ${ae}mm × ap ${ap}mm × F ${f}mm/min)`;
    }
  </script>
</body>
</html>
